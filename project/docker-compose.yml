version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safe_driving
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-change_this_in_production}
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/safe_driving
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY}
      ALLOWED_ORIGINS: http://localhost,http://localhost:80
      MODEL_ARTIFACT_PATH: /ml_model/model_artifacts/best_model.joblib
      SHAP_EXPLAINER_PATH: /ml_model/model_artifacts/explainer.joblib
    volumes:
      - ./ml_model:/ml_model:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
